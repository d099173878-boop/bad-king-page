<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>پنل مدیریت BAD_KING</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        body{background:#06080f;color:#e0e8f0;font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif;min-height:100vh;padding:20px;direction:rtl}
        
        .container{max-width:1100px;margin:0 auto}
        
        .header{background:rgba(6,8,15,0.85);border:1px solid rgba(0,240,255,0.05);border-radius:20px;padding:20px 25px;margin-bottom:20px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px}
        .header h1{font-size:22px;font-weight:800;background:linear-gradient(135deg,#00f0ff,#7b2ffc);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
        .header .actions{display:flex;gap:10px}
        .header button{padding:8px 18px;background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.06);border-radius:10px;color:#e0e8f0;cursor:pointer;font-size:13px;transition:0.3s}
        .header button:hover{background:rgba(255,255,255,0.05)}
        .header button.danger{color:#ff6b6b;border-color:rgba(255,107,107,0.15)}
        
        /* ورود */
        .login{max-width:400px;margin:80px auto;background:rgba(6,8,15,0.85);border:1px solid rgba(0,240,255,0.05);border-radius:20px;padding:35px}
        .login h2{font-size:20px;margin-bottom:20px;text-align:center}
        .login input{width:100%;padding:12px 16px;background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.06);border-radius:10px;color:#e0e8f0;font-size:15px;margin-bottom:12px;direction:ltr}
        .login input:focus{outline:none;border-color:rgba(0,240,255,0.2)}
        .login button{width:100%;padding:12px;background:linear-gradient(135deg,#00f0ff,#7b2ffc);border:none;border-radius:10px;color:#fff;font-size:16px;font-weight:600;cursor:pointer}
        .login-error{color:#ff6b6b;font-size:13px;text-align:center;margin-top:10px;display:none}
        
        /* محتوا */
        .content{display:none}
        .content.show{display:block}
        
        .tabs{display:flex;gap:8px;margin-bottom:20px;flex-wrap:wrap}
        .tab{padding:10px 20px;background:rgba(255,255,255,0.02);border:1px solid rgba(255,255,255,0.04);border-radius:10px;cursor:pointer;font-size:13px;transition:0.3s}
        .tab:hover{background:rgba(255,255,255,0.04)}
        .tab.active{background:rgba(0,240,255,0.05);border-color:rgba(0,240,255,0.15);color:#00f0ff}
        
        .panel{display:none;background:rgba(6,8,15,0.85);border:1px solid rgba(0,240,255,0.05);border-radius:20px;padding:25px}
        .panel.active{display:block}
        
        .panel h2{font-size:18px;margin-bottom:20px;color:#00f0ff}
        
        .form-group{margin-bottom:15px}
        .form-group label{display:block;font-size:13px;color:rgba(255,255,255,0.3);margin-bottom:6px}
        .form-group input,.form-group textarea,.form-group select{width:100%;padding:10px 14px;background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.06);border-radius:10px;color:#e0e8f0;font-size:14px;transition:0.3s}
        .form-group input:focus,.form-group textarea:focus,.form-group select:focus{outline:none;border-color:rgba(0,240,255,0.2)}
        .form-group textarea{resize:vertical;min-height:80px;font-family:inherit}
        
        .btn{padding:10px 20px;background:linear-gradient(135deg,#00f0ff,#7b2ffc);border:none;border-radius:10px;color:#fff;font-size:14px;font-weight:600;cursor:pointer;transition:0.3s}
        .btn:hover{transform:translateY(-2px);box-shadow:0 8px 25px rgba(0,240,255,0.15)}
        .btn.secondary{background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.06)}
        .btn.danger{background:rgba(255,107,107,0.1);border:1px solid rgba(255,107,107,0.2);color:#ff6b6b}
        
        .link-item{background:rgba(255,255,255,0.02);border:1px solid rgba(255,255,255,0.04);border-radius:12px;padding:15px;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px}
        .link-item .info{flex:1;min-width:200px}
        .link-item .name{font-weight:600;font-size:14px}
        .link-item .url{font-size:11px;color:rgba(255,255,255,0.15);direction:ltr;text-align:left;margin-top:3px;word-break:break-all}
        .link-item .btns{display:flex;gap:8px}
        .link-item .btns button{padding:6px 14px;font-size:12px;border-radius:8px;cursor:pointer;border:1px solid rgba(255,255,255,0.06);background:rgba(255,255,255,0.02);color:#e0e8f0}
        .link-item .btns button:hover{background:rgba(255,255,255,0.05)}
        .link-item .btns button.del{color:#ff6b6b;border-color:rgba(255,107,107,0.15)}
        
        .stats-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:20px}
        .stat-card{background:rgba(255,255,255,0.02);border-radius:12px;padding:15px;border:1px solid rgba(255,255,255,0.03)}
        .stat-card .num{font-size:26px;font-weight:700;color:#00f0ff}
        .stat-card .label{font-size:11px;color:rgba(255,255,255,0.15);margin-top:4px}
        
        .data-table{width:100%;border-collapse:collapse;font-size:12px;overflow-x:auto;display:block;white-space:nowrap}
        .data-table th{text-align:right;padding:10px 12px;background:rgba(255,255,255,0.02);color:rgba(255,255,255,0.15);font-weight:400;font-size:10px;border-bottom:1px solid rgba(255,255,255,0.04)}
        .data-table td{padding:10px 12px;border-bottom:1px solid rgba(255,255,255,0.02);color:rgba(255,255,255,0.5)}
        
        .toast{position:fixed;bottom:30px;left:50%;transform:translateX(-50%);background:rgba(0,240,255,0.1);border:1px solid rgba(0,240,255,0.15);padding:12px 25px;border-radius:12px;color:#00f0ff;font-size:13px;z-index:999;display:none;backdrop-filter:blur(10px)}
        .toast.show{display:block;animation:fadeIn 0.3s ease}
        .toast.error{background:rgba(255,107,107,0.1);border-color:rgba(255,107,107,0.15);color:#ff6b6b}
        @keyframes fadeIn{from{opacity:0;transform:translateX(-50%) translateY(20px)}to{opacity:1;transform:translateX(-50%) translateY(0)}}
        
        @media(max-width:600px){.header{padding:15px}.header h1{font-size:18px}.panel{padding:18px 15px}}
    </style>
</head>
<body>

<div class="container">
    <!-- ===== ورود ===== -->
    <div class="login" id="loginSection">
        <h2>🔐 ورود به پنل مدیریت</h2>
        <input type="password" id="adminPassword" placeholder="رمز عبور..." onkeyup="if(event.key==='Enter')checkLogin()">
        <button onclick="checkLogin()">ورود</button>
        <div class="login-error" id="loginError">رمز عبور اشتباه است!</div>
    </div>

    <!-- ===== محتوا ===== -->
    <div class="content" id="adminContent">
        <div class="header">
            <h1>👑 پنل مدیریت BAD_KING</h1>
            <div class="actions">
                <button onclick="saveAllData()">💾 ذخیره همه تغییرات</button>
                <button onclick="loadDataFromGitHub()">🔄 بارگذاری از گیت‌هاب</button>
            </div>
        </div>

        <!-- تب‌ها -->
        <div class="tabs">
            <div class="tab active" onclick="showTab('tab-links', this)">🔗 لینک‌ها</div>
            <div class="tab" onclick="showTab('tab-profile', this)">👤 پروفایل</div>
            <div class="tab" onclick="showTab('tab-visits', this)">📊 بازدیدکنندگان</div>
        </div>

        <!-- تب لینک‌ها -->
        <div class="panel active" id="tab-links">
            <h2>🔗 مدیریت لینک‌ها</h2>
            <div id="linksList"></div>
            <button class="btn" onclick="addNewLink()" style="margin-top:15px">➕ افزودن لینک جدید</button>
        </div>

        <!-- تب پروفایل -->
        <div class="panel" id="tab-profile">
            <h2>👤 پروفایل سایت</h2>
            <div class="form-group">
                <label>لوگو (URL)</label>
                <input type="text" id="profileLogo" placeholder="https://...">
            </div>
            <div class="form-group">
                <label>عنوان سایت</label>
                <input type="text" id="profileTitle" placeholder="BAD_KING">
            </div>
            <div class="form-group">
                <label>زیرعنوان</label>
                <input type="text" id="profileSubtitle" placeholder="◆ OFFICIAL PAGE ◆">
            </div>
            <div class="form-group">
                <label>بیوگرافی (HTML مجاز است)</label>
                <textarea id="profileBio" placeholder="به صفحه رسمی..."></textarea>
            </div>
            <button class="btn" onclick="saveProfile()">💾 ذخیره پروفایل</button>
        </div>

        <!-- تب بازدیدکنندگان -->
        <div class="panel" id="tab-visits">
            <h2>📊 اطلاعات بازدیدکنندگان</h2>
            <div class="stats-grid" id="statsGrid">
                <div class="stat-card"><div class="num" id="totalVisits">۰</div><div class="label">کل بازدیدها</div></div>
                <div class="stat-card"><div class="num" id="todayVisits">۰</div><div class="label">بازدید امروز</div></div>
                <div class="stat-card"><div class="num" id="uniqueDevices">۰</div><div class="label">دستگاه‌های یکتا</div></div>
                <div class="stat-card"><div class="num" id="lastVisit">--</div><div class="label">آخرین بازدید</div></div>
            </div>
            <div style="display:flex;gap:10px;margin-bottom:15px;flex-wrap:wrap">
                <button class="btn secondary" onclick="loadVisits()">🔄 بروزرسانی</button>
                <button class="btn danger" onclick="clearVisits()">🗑️ پاک کردن همه</button>
                <button class="btn secondary" onclick="exportVisits()">📥 خروجی JSON</button>
            </div>
            <div style="overflow-x:auto">
                <table class="data-table">
                    <thead>
                        <tr>
                            <th>زمان</th>
                            <th>دستگاه</th>
                            <th>مدل</th>
                            <th>سیستم‌عامل</th>
                            <th>مرورگر</th>
                            <th>صفحه</th>
                            <th>شبکه</th>
                            <th>حافظه</th>
                            <th>هسته</th>
                        </tr>
                    </thead>
                    <tbody id="visitsTable"></tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<div class="toast" id="toast"></div>

<script>
// ================================================================
// پنل مدیریت BAD_KING
// ================================================================

// ===== تنظیمات =====
const ADMIN_PASSWORD = 'badking2024';
const GITHUB_USERNAME = 'd099173878-boop';
const GITHUB_REPO = 'bad-king-page';
const GITHUB_FILE = 'data.json';

// ⚠️ توکن رو اینجا بذار
const GITHUB_TOKEN = 'TOKEN_HERE';

// ===== متغیرها =====
let currentData = null;
let tempLinks = [];

// ===== ورود =====
function checkLogin() {
    const input = document.getElementById('adminPassword').value;
    const error = document.getElementById('loginError');
    
    if (input === ADMIN_PASSWORD) {
        document.getElementById('loginSection').style.display = 'none';
        document.getElementById('adminContent').classList.add('show');
        loadDataFromGitHub();
        loadVisits();
    } else {
        error.style.display = 'block';
        setTimeout(() => { error.style.display = 'none'; }, 3000);
    }
}

// ===== تب =====
function showTab(tabId, el) {
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
    el.classList.add('active');
    document.getElementById(tabId).classList.add('active');
}

// ===== لود از گیت‌هاب =====
async function loadDataFromGitHub() {
    try {
        const res = await fetch(`https://raw.githubusercontent.com/${GITHUB_USERNAME}/${GITHUB_REPO}/main/${GITHUB_FILE}?t=${Date.now()}`);
        if (res.ok) {
            currentData = await res.json();
            renderLinks();
            renderProfile();
            showToast('✅ داده‌ها بارگذاری شد');
        } else {
            showToast('⚠️ فایل data.json یافت نشد', 'error');
        }
    } catch(e) {
        showToast('❌ خطا در بارگذاری: ' + e.message, 'error');
    }
}

// ===== رندر لینک‌ها =====
function renderLinks() {
    if (!currentData || !currentData.links) return;
    tempLinks = JSON.parse(JSON.stringify(currentData.links));
    
    const list = document.getElementById('linksList');
    let html = '';
    tempLinks.forEach((link, index) => {
        html += `
            <div class="link-item">
                <div class="info">
                    <div class="name">${link.platform || ''} - ${link.name}</div>
                    <div class="url">${link.url}</div>
                    <div style="font-size:11px;color:rgba(255,255,255,0.1);margin-top:3px">${link.desc || ''}</div>
                </div>
                <div class="btns">
                    <button onclick="editLink(${index})">✏️ ویرایش</button>
                    <button class="del" onclick="deleteLink(${index})">🗑️ حذف</button>
                </div>
            </div>
        `;
    });
    list.innerHTML = html || '<div style="text-align:center;padding:30px;color:rgba(255,255,255,0.1)">هیچ لینکی وجود ندارد</div>';
}

// ===== افزودن لینک =====
function addNewLink() {
    const platform = prompt('نام پلتفرم (مثلاً: اینستاگرام، تلگرام، بله):');
    if (!platform) return;
    const name = prompt('نام کاربری یا عنوان:');
    if (!name) return;
    const url = prompt('آدرس لینک (URL):');
    if (!url) return;
    const desc = prompt('توضیحات کوتاه:') || '';
    
    // تشخیص خودکار آیکون
    let icon = 'email', iconClass = 'fas fa-envelope';
    if (url.includes('instagram.com')) { icon = 'instagram'; iconClass = 'fab fa-instagram'; }
    else if (url.includes('t.me') || url.includes('telegram')) { icon = 'telegram'; iconClass = 'fab fa-telegram-plane'; }
    else if (url.includes('ble.ir')) { icon = 'bale'; iconClass = 'fas fa-comment-dots'; }
    else if (url.includes('mailto') || url.includes('@')) { icon = 'email'; iconClass = 'fas fa-envelope'; }
    
    tempLinks.push({ name, url, desc, platform, icon, iconClass });
    renderLinks();
    showToast('✅ لینک اضافه شد (برای ذخیره، دکمه ذخیره رو بزن)');
}

// ===== ویرایش لینک =====
function editLink(index) {
    const link = tempLinks[index];
    const platform = prompt('نام پلتفرم:', link.platform || '');
    if (platform === null) return;
    const name = prompt('نام کاربری:', link.name || '');
    if (name === null) return;
    const url = prompt('آدرس لینک:', link.url || '');
    if (url === null) return;
    const desc = prompt('توضیحات:', link.desc || '');
    if (desc === null) return;
    
    tempLinks[index] = { ...link, platform, name, url, desc };
    renderLinks();
    showToast('✅ لینک ویرایش شد');
}

// ===== حذف لینک =====
function deleteLink(index) {
    if (!confirm('آیا مطمئن هستید؟')) return;
    tempLinks.splice(index, 1);
    renderLinks();
    showToast('🗑️ لینک حذف شد');
}

// ===== رندر پروفایل =====
function renderProfile() {
    if (!currentData || !currentData.profile) return;
    document.getElementById('profileLogo').value = currentData.profile.logo || '';
    document.getElementById('profileTitle').value = currentData.profile.title || '';
    document.getElementById('profileSubtitle').value = currentData.profile.subtitle || '';
    document.getElementById('profileBio').value = currentData.profile.bio || '';
}

// ===== ذخیره پروفایل =====
function saveProfile() {
    if (!currentData) currentData = {};
    currentData.profile = {
        logo: document.getElementById('profileLogo').value,
        title: document.getElementById('profileTitle').value,
        subtitle: document.getElementById('profileSubtitle').value,
        bio: document.getElementById('profileBio').value
    };
    showToast('✅ پروفایل ذخیره شد (برای اعمال، دکمه ذخیره همه رو بزن)');
}

// ===== ذخیره همه در گیت‌هاب =====
async function saveAllData() {
    if (!currentData) currentData = {};
    currentData.links = tempLinks;
    
    try {
        // 1. گرفتن SHA فعلی فایل
        const getRes = await fetch(`https://api.github.com/repos/${GITHUB_USERNAME}/${GITHUB_REPO}/contents/${GITHUB_FILE}`, {
            headers: { 'Authorization': `token ${GITHUB_TOKEN}` }
        });
        
        if (!getRes.ok) throw new Error('خطا در دریافت فایل');
        const fileData = await getRes.json();
        const sha = fileData.sha;
        
        // 2. آپدیت فایل
        const content = btoa(unescape(encodeURIComponent(JSON.stringify(currentData, null, 2))));
        
        const updateRes = await fetch(`https://api.github.com/repos/${GITHUB_USERNAME}/${GITHUB_REPO}/contents/${GITHUB_FILE}`, {
            method: 'PUT',
            headers: {
                'Authorization': `token ${GITHUB_TOKEN}`,
                'Content-Type': 'application/json'
            },
            body: JSON.stringify({
                message: 'Update data.json from admin panel',
                content: content,
                sha: sha
            })
        });
        
        if (updateRes.ok) {
            showToast('✅ همه تغییرات با موفقیت ذخیره شد');
        } else {
            const err = await updateRes.json();
            throw new Error(err.message || 'خطا در ذخیره');
        }
    } catch(e) {
        showToast('❌ خطا در ذخیره: ' + e.message, 'error');
    }
}

// ===== لود بازدیدکنندگان =====
function loadVisits() {
    const visits = JSON.parse(localStorage.getItem('badking_visits') || '[]');
    
    document.getElementById('totalVisits').textContent = visits.length;
    
    const today = new Date().toLocaleDateString('fa-IR');
    const todayVisits = visits.filter(v => {
        const d = new Date(v.timeISO);
        return d.toLocaleDateString('fa-IR') === today;
    });
    document.getElementById('todayVisits').textContent = todayVisits.length;
    
    const devices = new Set(visits.map(v => (v.deviceModel || '') + '|' + (v.os || '')));
    document.getElementById('uniqueDevices').textContent = devices.size;
    
    document.getElementById('lastVisit').textContent = visits.length > 0 ? (visits[0].time || '--') : '--';
    
    // جدول
    const tbody = document.getElementById('visitsTable');
    if (visits.length === 0) {
        tbody.innerHTML = '<tr><td colspan="9" style="text-align:center;padding:30px;color:rgba(255,255,255,0.05)">هیچ اطلاعاتی وجود ندارد</td></tr>';
        return;
    }
    
    let html = '';
    visits.slice(0, 50).forEach(v => {
        html += `<tr>
            <td>${v.time || '--'}</td>
            <td>${v.deviceType || '--'}</td>
            <td>${v.deviceModel || '--'}</td>
            <td>${v.os || '--'}</td>
            <td>${v.browser || '--'}</td>
            <td>${v.screen || '--'}</td>
            <td>${v.networkType || '--'}</td>
            <td>${v.memory || '--'}</td>
            <td>${v.cores || '--'}</td>
        </tr>`;
    });
    tbody.innerHTML = html;
}

// ===== پاک کردن بازدیدها =====
function clearVisits() {
    if (!confirm('آیا مطمئن هستید که می‌خواهید همه اطلاعات بازدیدکنندگان را پاک کنید؟')) return;
    localStorage.removeItem('badking_visits');
    loadVisits();
    showToast('🗑️ همه اطلاعات پاک شد');
}

// ===== خروجی JSON =====
function exportVisits() {
    const visits = localStorage.getItem('badking_visits') || '[]';
    const blob = new Blob([visits], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'badking_visits.json';
    a.click();
    URL.revokeObjectURL(url);
    showToast('📥 خروجی دانلود شد');
}

// ===== Toast =====
function showToast(msg, type) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.className = 'toast show' + (type === 'error' ? ' error' : '');
    setTimeout(() => { t.classList.remove('show'); }, 3500);
}

console.log('👑 پنل مدیریت BAD_KING آماده است');
console.log('🔑 رمز پنل:', ADMIN_PASSWORD);
</script>
</body>
</html>
