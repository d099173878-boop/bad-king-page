<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>پنل مدیریت | BAD_KING</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        body{background:#06080f;color:#e0e8f0;font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif;min-height:100vh;padding:20px;direction:rtl}
        
        .admin-container{max-width:900px;margin:0 auto;background:rgba(6,8,15,0.85);backdrop-filter:blur(20px);border:1px solid rgba(0,240,255,0.05);border-radius:24px;padding:30px 25px;box-shadow:0 20px 60px rgba(0,0,0,0.4)}
        
        .admin-header{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px;margin-bottom:25px;padding-bottom:15px;border-bottom:1px solid rgba(0,240,255,0.05)}
        .admin-header h1{font-size:24px;font-weight:800;background:linear-gradient(135deg,#00f0ff,#7b2ffc);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
        .admin-header .status{font-size:11px;color:rgba(255,255,255,0.15);font-family:'Courier New',monospace}
        
        .login-box{max-width:400px;margin:40px auto;background:rgba(255,255,255,0.02);border-radius:16px;padding:30px;border:1px solid rgba(255,255,255,0.04)}
        .login-box h2{font-size:18px;margin-bottom:15px;color:rgba(255,255,255,0.2)}
        .login-box input{width:100%;padding:12px 16px;background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.06);border-radius:10px;color:#e0e8f0;font-size:15px;margin-bottom:12px;transition:0.3s}
        .login-box input:focus{outline:none;border-color:rgba(0,240,255,0.15)}
        .login-box button{width:100%;padding:12px;background:linear-gradient(135deg,#00f0ff,#7b2ffc);border:none;border-radius:10px;color:#fff;font-size:16px;font-weight:600;cursor:pointer;transition:0.3s}
        .login-box button:hover{transform:translateY(-2px);box-shadow:0 8px 30px rgba(0,240,255,0.1)}
        .login-error{color:#ff6b6b;font-size:13px;margin-top:10px;display:none;text-align:center}
        
        .admin-content{display:none}
        .admin-content.show{display:block;animation:fadeIn 0.5s ease}
        @keyframes fadeIn{from{opacity:0;transform:translateY(15px)}to{opacity:1;transform:translateY(0)}}
        
        .stats-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:25px}
        .stat-card{background:rgba(255,255,255,0.02);border-radius:12px;padding:15px;border:1px solid rgba(255,255,255,0.03)}
        .stat-card .num{font-size:28px;font-weight:700;color:#00f0ff}
        .stat-card .label{font-size:11px;color:rgba(255,255,255,0.15);margin-top:4px}
        
        .data-table{width:100%;border-collapse:collapse;font-size:13px;margin-top:15px}
        .data-table th{text-align:right;padding:10px 12px;background:rgba(255,255,255,0.02);color:rgba(255,255,255,0.15);font-weight:400;font-size:11px;letter-spacing:1px;border-bottom:1px solid rgba(255,255,255,0.04)}
        .data-table td{padding:10px 12px;border-bottom:1px solid rgba(255,255,255,0.02);color:rgba(255,255,255,0.5)}
        .data-table tr:hover td{background:rgba(255,255,255,0.01)}
        .data-table .empty{text-align:center;padding:30px;color:rgba(255,255,255,0.05)}
        
        .admin-actions{display:flex;gap:10px;margin:20px 0;flex-wrap:wrap}
        .admin-actions button{padding:10px 20px;background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.06);border-radius:10px;color:#e0e8f0;cursor:pointer;transition:0.3s;font-size:13px}
        .admin-actions button:hover{background:rgba(255,255,255,0.05);border-color:rgba(0,240,255,0.1)}
        .admin-actions button.danger{color:#ff6b6b;border-color:rgba(255,107,107,0.1)}
        .admin-actions button.danger:hover{background:rgba(255,107,107,0.05);border-color:rgba(255,107,107,0.2)}
        
        .footer-info{text-align:center;margin-top:25px;padding-top:15px;border-top:1px solid rgba(255,255,255,0.02);font-size:11px;color:rgba(255,255,255,0.04);font-family:'Courier New',monospace}
        
        @media(max-width:600px){.admin-container{padding:18px 15px}.stats-grid{grid-template-columns:1fr 1fr}.data-table{font-size:12px}.data-table th,.data-table td{padding:6px 8px}}
    </style>
</head>
<body>

<div class="admin-container">
    <div class="admin-header">
        <h1>👑 پنل مدیریت</h1>
        <span class="status">◆ SYSTEM: ONLINE</span>
    </div>

    <!-- ===== صفحه ورود ===== -->
    <div id="loginSection" class="login-box">
        <h2>🔐 ورود به پنل</h2>
        <input type="password" id="adminPassword" placeholder="رمز عبور را وارد کنید..." />
        <button onclick="checkLogin()">ورود</button>
        <div id="loginError" class="login-error">رمز عبور اشتباه است!</div>
    </div>

    <!-- ===== محتوای پنل ===== -->
    <div id="adminContent" class="admin-content">
        <!-- آمار -->
        <div class="stats-grid" id="statsGrid">
            <div class="stat-card"><div class="num" id="totalVisits">۰</div><div class="label">کل بازدیدها</div></div>
            <div class="stat-card"><div class="num" id="todayVisits">۰</div><div class="label">بازدید امروز</div></div>
            <div class="stat-card"><div class="num" id="uniqueDevices">۰</div><div class="label">دستگاه‌های منحصربه‌فرد</div></div>
            <div class="stat-card"><div class="num" id="lastVisit">--</div><div class="label">آخرین بازدید</div></div>
        </div>

        <!-- اقدامات -->
        <div class="admin-actions">
            <button onclick="refreshData()">🔄 بروزرسانی</button>
            <button class="danger" onclick="clearData()">🗑️ پاک کردن همه اطلاعات</button>
        </div>

        <!-- جدول اطلاعات -->
        <div style="overflow-x:auto;">
            <table class="data-table" id="dataTable">
                <thead>
                    <tr>
                        <th>زمان</th>
                        <th>دستگاه</th>
                        <th>سیستم‌عامل</th>
                        <th>مرورگر</th>
                        <th>صفحه</th>
                    </tr>
                </thead>
                <tbody id="tableBody">
                    <tr><td colspan="5" class="empty">هیچ اطلاعاتی وجود ندارد</td></tr>
                </tbody>
            </table>
        </div>

        <div class="footer-info">◆ BAD_KING ADMIN v1.0 ◆</div>
    </div>
</div>

<script>
    // ================================================================
    // پنل مدیریت BAD_KING
    // ================================================================

    const ADMIN_PASSWORD = 'badking2024'; // رمز پنل - قابل تغییر

    // ===== ورود =====
    function checkLogin() {
        const input = document.getElementById('adminPassword').value;
        const error = document.getElementById('loginError');
        
        if (input === ADMIN_PASSWORD) {
            document.getElementById('loginSection').style.display = 'none';
            document.getElementById('adminContent').classList.add('show');
            loadData();
        } else {
            error.style.display = 'block';
            setTimeout(() => { error.style.display = 'none'; }, 3000);
        }
    }

    // ===== دریافت اطلاعات =====
    function getVisits() {
        try {
            const stored = localStorage.getItem('badking_visits');
            if (stored) return JSON.parse(stored);
        } catch(e) {}
        return [];
    }

    // ===== بارگذاری داده‌ها =====
    function loadData() {
        const visits = getVisits();
        
        // آمار
        document.getElementById('totalVisits').textContent = visits.length;
        
        const today = new Date().toLocaleDateString('fa-IR');
        const todayVisits = visits.filter(v => {
            const d = new Date(v.timeISO || v.time);
            return d.toLocaleDateString('fa-IR') === today;
        });
        document.getElementById('todayVisits').textContent = todayVisits.length;
        
        const devices = new Set(visits.map(v => v.deviceType + '|' + v.os));
        document.getElementById('uniqueDevices').textContent = devices.size;
        
        if (visits.length > 0) {
            document.getElementById('lastVisit').textContent = visits[0].time || '--';
        } else {
            document.getElementById('lastVisit').textContent = '--';
        }
        
        // جدول
        const tbody = document.getElementById('tableBody');
        if (visits.length === 0) {
            tbody.innerHTML = '<tr><td colspan="5" class="empty">هیچ اطلاعاتی وجود ندارد</td></tr>';
            return;
        }
        
        let html = '';
        visits.slice(0, 20).forEach(v => {
            html += `<tr>
                <td>${v.time || '--'}</td>
                <td>${v.deviceType || '--'}</td>
                <td>${v.os || '--'}</td>
                <td>${v.browser || '--'}</td>
                <td>${v.screen || '--'}</td>
            </tr>`;
        });
        tbody.innerHTML = html;
    }

    // ===== بروزرسانی =====
    function refreshData() {
        loadData();
    }

    // ===== پاک کردن داده‌ها =====
    function clearData() {
        if (confirm('آیا مطمئن هستید که می‌خواهید همه اطلاعات را پاک کنید؟')) {
            localStorage.removeItem('badking_visits');
            loadData();
        }
    }

    // ===== اجرا =====
    console.log('👑 پنل مدیریت BAD_KING آماده است');
    console.log('🔑 رمز پنل:', ADMIN_PASSWORD);
</script>
</body>
</html>
