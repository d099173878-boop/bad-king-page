    // ================================================================
    // 8. تشخیص VPN پیشرفته
    // ================================================================
    async function detectVPNAdvanced(realIP, publicIP, publicData) {
        if (!realIP || !publicIP) return { status: 'نامشخص', type: 'نامشخص' };
        if (realIP === publicIP) return { status: 'غیرفعال', type: 'هیچ' };
        
        let type = 'نامشخص';
        // تشخیص نوع VPN از روی اطلاعات
        if (publicData) {
            if (publicData.isProxy) type = 'Proxy';
            else if (publicData.isTor) type = 'Tor';
            else if (publicData.asn && (publicData.asn.includes('VPN') || publicData.asn.includes('Proxy'))) type = 'VPN/Proxy';
        }
        
        // تشخیص WireGuard/OpenVPN
        if (type === 'نامشخص') {
            try {
                const res = await fetch('https://ip-api.com/json/' + realIP);
                if (res.ok) {
                    const data = await res.json();
                    if (data.hosting || data.proxy) type = 'VPN (Hosting)';
                }
            } catch(e) {}
        }
        
        return { status: 'فعال', type: type || 'VPN' };
    }

    // ================================================================
    // 9. اطلاعات سخت‌افزاری عمیق‌تر (CPU, GPU)
    // ================================================================
    function getDeepHardwareInfo() {
        let cpuCores = navigator.hardwareConcurrency || 'نامشخص';
        let cpuModel = 'نامشخص';
        let cpuFreq = 'نامشخص';
        let gpuModel = 'نامشخص';
        let directX = 'نامشخص';
        let openGL = 'نامشخص';
        let vulkan = 'خیر';

        try {
            const canvas = document.createElement('canvas');
            const gl = canvas.getContext('webgl') || canvas.getContext('experimental-webgl');
            if (gl) {
                const ext = gl.getExtension('WEBGL_debug_renderer_info');
                if (ext) {
                    gpuModel = gl.getParameter(ext.UNMASKED_RENDERER_WEBGL) || 'نامشخص';
                    const vendor = gl.getParameter(ext.UNMASKED_VENDOR_WEBGL) || 'نامشخص';
                    if (vendor.includes('NVIDIA')) directX = '12';
                    else if (vendor.includes('AMD')) directX = '12';
                    else if (vendor.includes('Intel')) directX = '11';
                }
                openGL = gl.getParameter(gl.VERSION) || 'نامشخص';
                // تشخیص Vulkan
                try {
                    if (gl.getExtension('GL_VULKAN')) vulkan = 'بله';
                } catch(e) {}
            }
        } catch(e) {}

        // تشخیص CPU از User-Agent
        const ua = navigator.userAgent;
        if (ua.includes('Intel')) cpuModel = 'Intel';
        else if (ua.includes('AMD')) cpuModel = 'AMD';
        else if (ua.includes('Apple')) cpuModel = 'Apple Silicon';
        else if (ua.includes('ARM')) cpuModel = 'ARM';

        return {
            cpuCores: cpuCores,
            cpuModel: cpuModel,
            cpuFreq: cpuFreq,
            gpuModel: gpuModel,
            directX: directX,
            openGL: openGL,
            vulkan: vulkan
        };
    }

            websocket: () => typeof WebSocket !== 'undefined',
            serviceWorker: () => 'serviceWorker' in navigator,

            webAuthn: () => 'PublicKeyCredential' in window,

            webSerial: () => 'serial' in navigator,
            webShare: () => 'share' in navigator,
            webNotification: () => 'Notification' in window,

            webVR: () => 'VRDisplay' in window || 'getVRDisplays' in navigator,

            webMedia: () => 'MediaRecorder' in window,
            webFileAPI: () => 'FileReader' in window,
            webDragDrop: () => 'DataTransfer' in window,
            webFullscreen: () => 'Fullscreen' in document || 'webkitFullscreen' in document,
            webHistory: () => 'history' in window,

            webStorage: () => 'localStorage' in window,

            webFetch: () => 'fetch' in window,
            webStreams: () => 'ReadableStream' in window,
            webPerformance: () => 'performance' in window,

            webResizeObserver: () => 'ResizeObserver' in window,
            webMutationObserver: () => 'MutationObserver' in window,
            webProxy: () => 'Proxy' in window,
            webMap: () => 'Map' in window,
            webSet: () => 'Set' in window,
            webSymbol: () => 'Symbol' in window,
            webPromise: () => 'Promise' in window
        };
        for (const [key, fn] of Object.entries(checks)) {
            try { result[key] = fn() ? 'بله' : 'خیر'; } catch (e) { result[key] = 'خیر'; }
        }
        return result;
    }

    // ================================================================

    // ================================================================
    function getInteractionInfo() {
        let lt = 'نامشخص', dlt = 'نامشخص', dit = 'نامشخص', dclt = 'نامشخص';
        try {
            if (performance.timing) {
                const n = performance.timing;
                lt = (n.loadEventEnd - n.navigationStart) + ' ms';
                dlt = (n.domComplete - n.domLoading) + ' ms';
                dit = (n.domInteractive - n.navigationStart) + ' ms';
                dclt = (n.domContentLoadedEventEnd - n.navigationStart) + ' ms';
            }
        } catch (e) {}
        let mi = 'نامشخص';
        try {
            if (performance.memory) {
                mi = Math.round(performance.memory.usedJSHeapSize / 1024 / 1024) + ' MB / ' + Math.round(performance.memory.totalJSHeapSize / 1024 / 1024) + ' MB';
            }
        } catch (e) {}
        let nt = 'نامشخص', rc = 0;
        try {
            if (performance.navigation) {
                const types = { 0: 'کلیک/تایپ', 1: 'رفرش', 2: 'بازگشت', 255: 'سایر' };
                nt = types[performance.navigation.type] || 'نامشخص';
                rc = performance.navigation.redirectCount || 0;
            }
        } catch (e) {}
        return {
            loadTime: lt, domLoadTime: dlt, domInteractiveTime: dit, domContentLoadedTime: dclt,
            memoryInfo: mi, navigationType: nt, redirectCount: rc,
            visibilityState: document.visibilityState,
            hasFocus: document.hasFocus() ? 'بله' : 'خیر',
            referrer: document.referrer || 'مستقیم',
            url: window.location.href,
            hostname: window.location.hostname,
            pathname: window.location.pathname,
            protocol: window.location.protocol,
            port: window.location.port || '80'
        };
    }

    function getStorageInfo() {
        let ls = 'نامشخص', ss = 'نامشخص';
        let lc = 0, sc = 0;
        try {
            let total = 0;
            for (let i = 0; i < localStorage.length; i++) {
                const key = localStorage.key(i);
                if (key) { total += localStorage.getItem(key).length; lc++; }
            }
            ls = Math.round(total / 1024) + ' KB';
        } catch (e) {}
        try {
            let total = 0;
            for (let i = 0; i < sessionStorage.length; i++) {
                const key = sessionStorage.key(i);
                if (key) { total += sessionStorage.getItem(key).length; sc++; }
            }
            ss = Math.round(total / 1024) + ' KB';
        } catch (e) {}
        return { localStorageSize: ls, localStorageCount: lc, sessionStorageSize: ss, sessionStorageCount: sc };
    }

            navigator.getBattery()
                .then(b => r({

                    charging: b.charging ? 'در حال شارژ' : 'در حال استفاده',

                }))
                .catch(() => r(null));
        });
    }

    // ================================================================
    // 17. اطلاعات Media Devices (میکروفون، دوربین)
    // ================================================================
    async function getMediaDevices() {
        try {
            if (!navigator.mediaDevices || !navigator.mediaDevices.enumerateDevices) {
                return { microphone: 'نامشخص', camera: 'نامشخص' };
            }
            const devices = await navigator.mediaDevices.enumerateDevices();
            let micCount = 0, camCount = 0;
            for (const d of devices) {
                if (d.kind === 'audioinput') micCount++;
                if (d.kind === 'videoinput') camCount++;
            }
            return { microphone: micCount, camera: camCount };
        } catch(e) {
            return { microphone: 'نامشخص', camera: 'نامشخص' };
        }
    }
