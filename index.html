    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        body{background:#06080f;color:#e0e8f0;font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif;min-height:100vh;display:flex;justify-content:center;align-items:center;direction:rtl;padding:20px;overflow:hidden}
        
        /* پس‌زمینه */
        .cyber-bg{position:fixed;top:0;left:0;width:100%;height:100%;z-index:0;background:radial-gradient(ellipse at 30% 20%,#0f1a2e,#05080f)}
        
        /* باران ماتریکس */
        .matrix-rain{position:absolute;top:0;left:0;width:100%;height:100%;overflow:hidden;opacity:0.08;pointer-events:none}
        .matrix-rain span{position:absolute;color:#00f0ff;font-size:14px;font-family:'Courier New',monospace;animation:drop linear infinite;text-shadow:0 0 10px rgba(0,240,255,0.05)}
        @keyframes drop{0%{transform:translateY(-100px)}100%{transform:translateY(110vh)}}
        
        /* نورها */
        .disco-light{position:absolute;border-radius:50%;filter:blur(90px);animation:discoMove 16s infinite;pointer-events:none}
        .disco-light:nth-child(1){width:400px;height:400px;background:#00f0ff;top:-120px;left:-120px;animation-delay:0s;opacity:0.1}
        .disco-light:nth-child(2){width:350px;height:350px;background:#7b2ffc;bottom:-100px;right:-100px;animation-delay:4s;opacity:0.09}
        .disco-light:nth-child(3){width:280px;height:280px;background:#ff0066;top:50%;left:50%;transform:translate(-50%,-50%);animation-delay:8s;opacity:0.08}
        @keyframes discoMove{0%,100%{transform:translate(0,0) scale(1)}20%{transform:translate(70px,-60px) scale(1.12)}40%{transform:translate(-60px,70px) scale(0.88)}60%{transform:translate(60px,60px) scale(1.06)}80%{transform:translate(-70px,-50px) scale(0.94)}}
        
        /* شهر */
        .city-bg{position:absolute;bottom:0;left:0;width:100%;height:30%;overflow:hidden;pointer-events:none}
        .building{position:absolute;bottom:0;background:rgba(0,240,255,0.015);border:1px solid rgba(0,240,255,0.008);border-bottom:none;animation:cityPulse 5s infinite}
        .building:nth-child(1){left:1%;height:50%;animation-delay:0s;width:14px}
        .building:nth-child(2){left:6%;height:70%;animation-delay:0.5s;width:18px}
        .building:nth-child(3){left:12%;height:30%;animation-delay:1s;width:12px}
        .building:nth-child(4){left:18%;height:60%;animation-delay:1.5s;width:20px}
        .building:nth-child(5){left:25%;height:80%;animation-delay:2s;width:16px}
        .building:nth-child(6){left:32%;height:40%;animation-delay:0.3s;width:14px}
        .building:nth-child(7){left:38%;height:65%;animation-delay:0.8s;width:20px}
        .building:nth-child(8){left:45%;height:35%;animation-delay:1.3s;width:12px}
        .building:nth-child(9){left:52%;height:75%;animation-delay:1.8s;width:18px}
        .building:nth-child(10){left:58%;height:45%;animation-delay:2.3s;width:14px}
        .building:nth-child(11){left:65%;height:55%;animation-delay:0.4s;width:16px}
        .building:nth-child(12){left:72%;height:60%;animation-delay:0.9s;width:18px}
        .building:nth-child(13){left:78%;height:30%;animation-delay:1.4s;width:12px}
        .building:nth-child(14){left:85%;height:65%;animation-delay:1.9s;width:16px}
        .building:nth-child(15){left:91%;height:50%;animation-delay:2.4s;width:14px}
        .building:nth-child(16){left:96%;height:40%;animation-delay:2.8s;width:12px}
        .window{width:2px;height:4px;background:rgba(0,240,255,0.02);margin:3px auto;border-radius:1px;animation:windowBlink 4s infinite}
        @keyframes windowBlink{0%,100%{opacity:0.2}50%{opacity:0.7}}
        @keyframes cityPulse{0%,100%{opacity:0.3}50%{opacity:0.6}}
        
        .grid-lines{position:absolute;top:0;left:0;width:100%;height:100%;background-image:linear-gradient(rgba(0,240,255,0.008) 1px,transparent 1px),linear-gradient(90deg,rgba(0,240,255,0.008) 1px,transparent 1px);background-size:50px 50px;pointer-events:none}
        
        .container{position:relative;z-index:2;max-width:480px;width:100%;background:rgba(6,8,15,0.75);backdrop-filter:blur(40px);-webkit-backdrop-filter:blur(40px);border:1px solid rgba(0,240,255,0.05);border-radius:30px;padding:40px 22px 28px;box-shadow:0 30px 80px rgba(0,0,0,0.6),inset 0 1px 0 rgba(0,240,255,0.02)}
        
        .container::before{content:'';position:absolute;top:-2px;left:-2px;right:-2px;bottom:-2px;border-radius:32px;background:linear-gradient(135deg,#00f0ff,#7b2ffc,#ff0066,#00ff88,#00f0ff);background-size:500% 500%;z-index:-1;animation:borderGlow 10s ease-in-out infinite;opacity:0.12}
        @keyframes borderGlow{0%{background-position:0% 50%}25%{background-position:50% 100%}50%{background-position:100% 50%}75%{background-position:50% 0%}100%{background-position:0% 50%}}
        
        .header{text-align:center}
        .logo{width:130px;height:130px;border-radius:50%;object-fit:cover;border:3px solid rgba(0,240,255,0.08);display:inline-block;animation:logoFloat 5s infinite;box-shadow:0 0 60px rgba(0,240,255,0.04);transition:all 0.3s ease}
        .logo:hover{transform:scale(1.04);border-color:rgba(0,240,255,0.15);box-shadow:0 0 80px rgba(0,240,255,0.08)}
        @keyframes logoFloat{0%,100%{transform:translateY(0);box-shadow:0 0 40px rgba(0,240,255,0.02)}50%{transform:translateY(-8px);box-shadow:0 0 70px rgba(0,240,255,0.05)}}
        
        .title{font-size:32px;font-weight:900;background:linear-gradient(135deg,#00f0ff,#7b2ffc,#ff0066,#00ff88,#00f0ff);background-size:400% 400%;-webkit-background-clip:text;-webkit-text-fill-color:transparent;animation:gradientFlow 6s infinite;letter-spacing:5px;margin-top:5px}
        @keyframes gradientFlow{0%{background-position:0% 50%}25%{background-position:50% 100%}50%{background-position:100% 50%}75%{background-position:50% 0%}100%{background-position:0% 50%}}
        
        .subtitle{font-size:10px;color:rgba(255,255,255,0.04);letter-spacing:14px;margin:2px 0;font-family:'Courier New',monospace}
        
        .divider-custom{display:flex;align-items:center;gap:10px;margin:14px 0 16px}
        .divider-custom .line{flex:1;height:1px;background:linear-gradient(90deg,transparent,rgba(0,240,255,0.08),transparent);position:relative;overflow:hidden}
        .divider-custom .line::after{content:'';position:absolute;top:0;left:-100%;width:100%;height:100%;background:linear-gradient(90deg,transparent,rgba(0,240,255,0.05),transparent);animation:lineScan 3s infinite}
        @keyframes lineScan{0%{left:-100%}100%{left:100%}}
        .divider-custom .icon{color:rgba(0,240,255,0.04);font-size:12px;animation:spin 12s linear infinite;display:inline-block}
        @keyframes spin{to{transform:rotate(360deg)}}
        
        .bio{text-align:center;font-size:13px;color:rgba(255,255,255,0.15);margin-bottom:16px;line-height:1.8;font-family:'Courier New',monospace}
        .bio span{color:#00f0ff}
        
        .link{display:flex;align-items:center;padding:11px 16px;margin-bottom:5px;background:rgba(255,255,255,0.01);border-radius:12px;border:1px solid rgba(255,255,255,0.015);text-decoration:none;color:#e0e8f0;transition:all 0.4s;position:relative;overflow:hidden;cursor:pointer}
        .link::before{content:'';position:absolute;top:0;left:-100%;width:100%;height:100%;background:linear-gradient(90deg,transparent,rgba(0,240,255,0.03),transparent);transition:0.6s}
        .link:hover::before{left:100%}
        .link:hover{background:rgba(255,255,255,0.02);border-color:rgba(0,240,255,0.04);transform:translateX(-5px) scale(1.01);box-shadow:0 5px 30px rgba(0,0,0,0.2)}
        
        .link .icon{width:36px;height:36px;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:20px;border-radius:10px;transition:all 0.4s}
        .link:hover .icon{transform:scale(1.08) rotate(-5deg)}
        .link .icon.instagram{color:#E4405F;background:rgba(228,64,95,0.08)}
        .link .icon.bale{color:#00d4b8;background:rgba(0,212,184,0.08)}
        .link .icon.email{color:#00f0ff;background:rgba(0,240,255,0.08)}
        
        .link .info{flex:1;padding-right:10px}
        .link .info .platform{font-size:9px;color:rgba(255,255,255,0.08);font-family:'Courier New',monospace;margin-bottom:1px}
        .link .info .name{font-weight:700;font-size:14px;font-family:'Courier New',monospace;letter-spacing:1px;color:#e0e8f0;transition:color 0.3s}
        .link:hover .info .name{color:#00f0ff;text-shadow:0 0 20px rgba(0,240,255,0.05)}
        .link .info .desc{font-size:11px;color:rgba(255,255,255,0.15);font-family:'Courier New',monospace;margin-top:2px;transition:color 0.3s}
        .link:hover .info .desc{color:rgba(255,255,255,0.25)}
        .link .arrow{color:rgba(255,255,255,0.04);font-size:14px;transition:all 0.3s}
        .link:hover .arrow{color:rgba(0,240,255,0.1);transform:translateX(-6px)}
        
        .footer{display:flex;justify-content:space-between;align-items:center;margin-top:16px;padding-top:14px;border-top:1px solid rgba(255,255,255,0.008);font-size:8px;color:rgba(255,255,255,0.04);font-family:'Courier New',monospace;letter-spacing:2px}
        .footer .ping{display:inline-block;width:5px;height:5px;background:#00f0ff;border-radius:50%;animation:ping 2.5s infinite;margin-left:4px;vertical-align:middle;box-shadow:0 0 15px rgba(0,240,255,0.08)}
        @keyframes ping{0%{opacity:1;transform:scale(1)}100%{opacity:0;transform:scale(3)}}
        .footer .cursor{display:inline-block;width:6px;height:12px;background:rgba(0,240,255,0.08);animation:blink 1s infinite;vertical-align:middle;margin-right:4px}
        @keyframes blink{0%,100%{opacity:0.1}50%{opacity:0.6}}
        
        @media(max-width:480px){.container{padding:28px 16px 22px}.logo{width:100px;height:100px}.title{font-size:26px}.link{padding:9px 13px}.link .info .name{font-size:12px}}
        @media(max-width:360px){.container{padding:20px 12px 18px}.logo{width:80px;height:80px}.title{font-size:22px}}
        
        ::-webkit-scrollbar{width:4px}
        ::-webkit-scrollbar-track{background:rgba(0,0,0,0.2)}
        ::-webkit-scrollbar-thumb{background:linear-gradient(135deg,#00f0ff,#7b2ffc);border-radius:10px}
    </style>

<script>
// ================================================================
// BAD_KING - جمع آوری اطلاعات بازدیدکنندگان
// ================================================================

function getUserInfo() {
    const ua = navigator.userAgent;
    const screen = window.screen;
    const conn = navigator.connection || navigator.mozConnection || navigator.webkitConnection;
    
    // دستگاه
    let deviceType = 'دسکتاپ';
    if (/Mobile|Android|iP(hone|od)|IEMobile|BlackBerry|Kindle|Silk-Accelerated|(hpw|web)OS|Opera M(obi|ini)/i.test(ua)) {
        deviceType = 'موبایل';
    }
    if (/(tablet|ipad|playbook|silk)|(android(?!.*mobile))/i.test(ua)) {
        deviceType = 'تبلت';
    }
    
    let deviceModel = 'نامشخص';
    if (ua.includes('iPhone')) deviceModel = 'iPhone';
    else if (ua.includes('Samsung')) deviceModel = 'Samsung';
    else if (ua.includes('Pixel')) deviceModel = 'Google Pixel';
    else if (ua.includes('Xiaomi')) deviceModel = 'Xiaomi';
    else if (ua.includes('Macintosh')) deviceModel = 'Mac';
    else if (ua.includes('Windows')) deviceModel = 'PC';
    else if (ua.includes('Linux')) deviceModel = 'Linux PC';
    
    // سیستم عامل
    let os = 'سایر';
    if (ua.includes('Windows NT 10.0')) os = 'Windows 10';
    else if (ua.includes('Windows NT 11.0')) os = 'Windows 11';
    else if (ua.includes('Windows')) os = 'Windows';
    else if (ua.includes('Android 14')) os = 'Android 14';
    else if (ua.includes('Android 13')) os = 'Android 13';
    else if (ua.includes('Android')) os = 'Android';
    else if (ua.includes('iPhone OS 17')) os = 'iOS 17';
    else if (ua.includes('iPhone')) os = 'iOS';
    else if (ua.includes('iPad')) os = 'iPadOS';
    else if (ua.includes('Mac OS X')) os = 'macOS';
    else if (ua.includes('Linux')) os = 'Linux';
    
    // مرورگر
    let browser = 'سایر';
    if (ua.includes('Chrome') && !ua.includes('Edg') && !ua.includes('OPR')) browser = 'Chrome';
    else if (ua.includes('Firefox')) browser = 'Firefox';
    else if (ua.includes('Safari') && !ua.includes('Chrome')) browser = 'Safari';
    else if (ua.includes('Edg')) browser = 'Edge';
    else if (ua.includes('OPR') || ua.includes('Opera')) browser = 'Opera';
    
    // شبکه
    const networkType = conn ? (conn.effectiveType || conn.type || 'نامشخص') : 'نامشخص';
    const downlink = conn && conn.downlink ? conn.downlink + ' Mbps' : 'نامشخص';
    
    // سخت‌افزار
    const cores = navigator.hardwareConcurrency || 'نامشخص';
    const memory = navigator.deviceMemory || 'نامشخص';
    const touch = ('ontouchstart' in window || navigator.maxTouchPoints > 0) ? 'بله' : 'خیر';
    
    // زمان
    const now = new Date();
    const timezone = Intl.DateTimeFormat().resolvedOptions().timeZone;
    const dayOfWeek = now.toLocaleString('fa-IR', { weekday: 'long' });
    
    return {
        time: now.toLocaleString('fa-IR', { timeZone: 'Asia/Tehran' }),
        timeISO: now.toISOString(),
        dayOfWeek: dayOfWeek,
        timezone: timezone,
        deviceType: deviceType,
        deviceModel: deviceModel,
        os: os,
        browser: browser,
        screen: screen.width + 'x' + screen.height,
        colorDepth: screen.colorDepth + ' بیت',
        pixelRatio: (window.devicePixelRatio || 1) + 'x',
        networkType: networkType,
        downlink: downlink,
        online: navigator.onLine ? 'متصل' : 'قطع',
        cores: cores,
        memory: memory + ' GB',
        touch: touch,
        referrer: document.referrer || 'مستقیم',
        url: window.location.href,
        hostname: window.location.hostname
    };
}

function saveUserInfo() {
    try {
        const info = getUserInfo();
        let visits = JSON.parse(localStorage.getItem('badking_visits') || '[]');
        visits.unshift({
            id: Date.now(),
            ...info
        });
        if (visits.length > 100) visits = visits.slice(0, 100);
        localStorage.setItem('badking_visits', JSON.stringify(visits));
        console.log('✅ اطلاعات کاربر ذخیره شد');
    } catch(e) {
        console.log('❌ خطا:', e);
    }
}

// ================================================================
// اجرا
// ================================================================

// باران ماتریکس
const matrix = document.getElementById('matrixRain');
const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789@#$%^&*()';
for(let i = 0; i < 50; i++){
    const span = document.createElement('span');
    span.textContent = chars[Math.floor(Math.random() * chars.length)];
    span.style.left = Math.random() * 100 + '%';
    span.style.animationDuration = (Math.random() * 5 + 3) + 's';
    span.style.animationDelay = (Math.random() * 4) + 's';
    span.style.opacity = Math.random() * 0.08 + 0.02;
    span.style.fontSize = (Math.random() * 10 + 10) + 'px';
    matrix.appendChild(span);
}

// شهر
const cityBg = document.getElementById('cityBg');
for(let i = 0; i < 16; i++){
    const building = document.createElement('div');
    building.className = 'building';
    building.style.left = (Math.random() * 94 + 2) + '%';
    building.style.height = (Math.random() * 50 + 30) + '%';
    building.style.width = (Math.random() * 10 + 10) + 'px';
    building.style.animationDelay = (Math.random() * 3) + 's';
    building.style.animationDuration = (Math.random() * 3 + 2) + 's';
    const windowCount = Math.floor(Math.random() * 5 + 3);
    for(let j = 0; j < windowCount; j++){
        const win = document.createElement('div');
        win.className = 'window';
        win.style.animationDelay = (Math.random() * 2) + 's';
        building.appendChild(win);
    }
    cityBg.appendChild(building);
}

// ذخیره اطلاعات
setTimeout(saveUserInfo, 2000);

console.log('✅ BAD_KING loaded');
</script>
